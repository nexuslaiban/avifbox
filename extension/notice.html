<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>This image was not saved – AVIFBox</title>
    <link rel="stylesheet" href="./notice.css" />
    <script type="module" src="./notice.ts"></script>
  </head>
  <body>
    <main>
      <h1>This image was not saved</h1>
      <p id="failure"></p>
      <p class="advice">
        You can still save it with the browser’s own “Save image as…”. AVIF, WebP, JPG and PNG files can be converted at
        <a href="https://avifbox.com/" target="_blank" rel="noopener">avifbox.com</a>.
      </p>
      <button type="button" autofocus aria-describedby="failure">Close</button>
    </main>
  </body>
</html>
