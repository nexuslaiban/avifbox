# Deploys the site: a push to main, or a start by hand from the Actions tab, runs `pnpm run deploy` as it is.
# Spec: docs/specs/2026-11-24-github-actions.md
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time, never cancelled once running. GitHub keeps one waiting run and replaces it with a newer
# one, which deploys the newer commit, so everything the replaced one would have. A group per branch: a start by
# hand on another branch, which deploys nothing, must not replace a waiting deploy of main.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    # A start by hand can name any branch; only main is the site.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # A run tried again keeps the commit it was started for: re-running an old run would put an older site live.
      - name: Only the newest commit of main goes live
        run: |
          head="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "::error::main is at $head, this run is for $GITHUB_SHA: start a deploy by hand to put main live"
            exit 1
          fi
      # Pinned by commit: the pnpm it installs runs the deploy, with the token. Reads `packageManager`.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps

      # What IndexNow is still owed (scripts/tell-indexnow.ts) outlives the runner: the most recent note an
      # earlier run saved comes back. A cache entry cannot be replaced, so each run saves under a key of its own.
      - uses: actions/cache/restore@v6
        with:
          path: .indexnow-owed.json
          key: indexnow-owed-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: indexnow-owed-
      - run: pnpm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # A deploy that passed has sent the note and removed it. Saved as "nothing owed", or the next run would get
      # back the last note, which was already sent.
      - if: success()
        run: echo '[]' > .indexnow-owed.json
      - if: always()
        uses: actions/cache/save@v6
        with:
          path: .indexnow-owed.json
          key: indexnow-owed-${{ github.run_id }}-${{ github.run_attempt }}

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-results/
          retention-days: 7
